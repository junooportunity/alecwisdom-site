<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>The Noetic Trilogy &#8212; Alec Wisdom</title>
    <link rel="icon" type="image/x-icon" href="Images/icons/icon.ico?v=3">
    <link rel="icon" type="image/png" sizes="32x32" href="Images/icons/icon-32x32.png?v=3">
    <link rel="icon" type="image/png" sizes="16x16" href="Images/icons/icon-16x16.png?v=3">

    <meta name="author" content="Alec Wisdom">
    <link rel="canonical" href="https://alecwisdom.com/on-monism">
    <meta property="og:type" content="book">
    <meta property="og:url" content="https://alecwisdom.com/on-monism">
    <meta property="og:title" content="The Noetic Trilogy &#8212; Alec Wisdom">
    <meta property="og:description" content="On Monism, On Gnosis, On Logos — a trilogy by Alec Wisdom.">
    <meta property="og:site_name" content="Alec Wisdom">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="The Noetic Trilogy &#8212; Alec Wisdom">
    <meta name="twitter:description" content="On Monism, On Gnosis, On Logos — a trilogy by Alec Wisdom.">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0a0a0a;
            --text-bright: #ffffff;
            --text-high: rgba(255, 255, 255, 0.85);
            --text-mid: rgba(255, 255, 255, 0.5);
            --text-dim: rgba(255, 255, 255, 0.25);
            --border: rgba(255, 255, 255, 0.1);
            --lg-shadow-blur: 10px;
            --lg-shadow-spread: -6px;
            --lg-shadow-color: rgba(255, 255, 255, 0.4);
            --lg-tint-color: 255, 255, 255;
            --lg-tint-opacity: 0.04;
            --lg-frost-blur: 2px;
            --lg-outer-shadow-blur: 24px;
            --lg-border-color: rgba(255, 255, 255, 0.25);
            --lg-border-width: 0.5px;
            --ease: cubic-bezier(0.22, 1, 0.36, 1);
        }

        html { scroll-behavior: auto; font-size: 16px; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        body {
            font-family: 'Times New Roman', Times, serif;
            font-weight: 400;
            background: var(--bg);
            color: #cccccc;
            font-size: 11px;
            line-height: 1.5;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            overflow-x: hidden;
            animation: fadeIn 3s ease-out;
        }

        /* Nav pill */
        .nav {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            padding: 6px 12px;
            border-radius: 28px;
            isolation: isolate;
            box-shadow: 0px 6px var(--lg-outer-shadow-blur) rgba(0, 0, 0, 0.25);
        }
        .nav::before {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 0;
            border-radius: 28px;
            box-shadow: inset 0 0 var(--lg-shadow-blur) var(--lg-shadow-spread) var(--lg-shadow-color);
            background-color: rgba(var(--lg-tint-color), var(--lg-tint-opacity));
            border: var(--lg-border-width) solid var(--lg-border-color);
            pointer-events: none;
        }
        .nav::after {
            content: '';
            position: absolute;
            inset: 0;
            z-index: -1;
            border-radius: 28px;
            backdrop-filter: blur(var(--lg-frost-blur));
            filter: url(#glass-distortion);
            -webkit-backdrop-filter: blur(var(--lg-frost-blur));
            -webkit-filter: url("#glass-distortion");
        }
        .nav a {
            font-size: 13px;
            font-family: 'Times New Roman', Times, serif;
            font-weight: 400;
            text-transform: uppercase;
            color: #cccccc;
            text-decoration: none;
            padding: 8px 16px;
            position: relative;
            transition: color 0.2s;
        }
        .nav a:hover { color: var(--text-bright); }

        /* Pill label */
        .section-label {
            font-family: 'Times New Roman', Times, serif;
            font-size: 0.65rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: rgba(255, 255, 255, 0.9);
            margin: 0 auto;
            text-align: center;
            padding: 5px 16px;
            display: inline-block;
            position: relative;
            border-radius: 50px;
            isolation: isolate;
            box-shadow: 0px 4px var(--lg-outer-shadow-blur) rgba(0, 0, 0, 0.2);
        }
        .section-label::before {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 0;
            border-radius: 50px;
            box-shadow: inset 0 0 var(--lg-shadow-blur) var(--lg-shadow-spread) var(--lg-shadow-color);
            background-color: rgba(var(--lg-tint-color), var(--lg-tint-opacity));
            border: var(--lg-border-width) solid var(--lg-border-color);
            pointer-events: none;
        }
        .section-label::after {
            content: '';
            position: absolute;
            inset: 0;
            z-index: -1;
            border-radius: 50px;
            backdrop-filter: blur(var(--lg-frost-blur));
            filter: url(#glass-distortion);
            -webkit-backdrop-filter: blur(var(--lg-frost-blur));
            -webkit-filter: url("#glass-distortion");
        }

        /* Hero */
        .hero {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 96px 24px 64px;
            text-align: center;
            gap: 24px;
        }

        .select-hint {
            font-size: 0.6rem;
            letter-spacing: 0.22em;
            color: var(--text-mid);
            margin-top: 4px;
        }

        /* Shelf of books */
        .shelf {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: flex-end;
            gap: 0;
            width: 100%;
            max-width: 1400px;
            margin: 16px auto 0;
        }

        .slot {
            flex: 0 0 auto;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            transition:
                opacity 0.7s var(--ease),
                transform 0.9s var(--ease),
                max-width 0.9s var(--ease),
                margin 0.9s var(--ease);
            max-width: 460px;
        }
        .slot model-viewer {
            width: 420px;
            height: 540px;
            background: transparent;
            --poster-color: transparent;
            transition: width 0.9s var(--ease), height 0.9s var(--ease);
            outline: none;
        }
        .slot model-viewer::part(default-progress-bar) { display: none; }
        .slot model-viewer:focus,
        .slot model-viewer:focus-visible { outline: none; box-shadow: none; }

        .slot .label {
            text-align: center;
            transition: opacity 0.4s var(--ease);
        }
        .slot .label .title {
            font-size: 0.8rem;
            letter-spacing: 0.18em;
            color: var(--text-high);
            margin-bottom: 6px;
        }
        .slot .label .sub {
            font-size: 0.6rem;
            letter-spacing: 0.22em;
            color: var(--text-mid);
            margin-bottom: 4px;
        }
        .slot .label .pages {
            font-size: 0.58rem;
            letter-spacing: 0.22em;
            color: var(--text-dim);
        }

        /* Selection state */
        .shelf.selecting .slot:not(.selected) {
            opacity: 0;
            transform: translateY(40px) scale(0.72);
            pointer-events: none;
            max-width: 0;
            margin-left: -1rem;
            margin-right: -1rem;
        }
        .shelf.selecting .slot.selected model-viewer {
            width: 520px;
            height: 660px;
        }
        .shelf.selecting .slot.selected .label {
            opacity: 0;
        }
        body.selecting .section-label { opacity: 0.4; transition: opacity 0.5s var(--ease); }
        body.selecting .select-hint { opacity: 0; transition: opacity 0.4s var(--ease); }

        /* Detail */
        .detail {
            max-width: 560px;
            margin: 0 auto;
            padding: 1rem 2rem 6rem;
            text-align: center;
            opacity: 0;
            transform: translateY(24px);
            pointer-events: none;
            transition: opacity 0.8s var(--ease), transform 0.8s var(--ease);
        }
        .detail.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
            transition-delay: 0.3s;
        }
        .detail .title {
            font-size: 0.9rem;
            letter-spacing: 0.22em;
            color: var(--text-high);
            margin-bottom: 6px;
        }
        .detail .sub {
            font-size: 0.6rem;
            letter-spacing: 0.22em;
            color: var(--text-mid);
            margin-bottom: 4px;
        }
        .detail .pages {
            font-size: 0.58rem;
            letter-spacing: 0.22em;
            color: var(--text-dim);
            margin-bottom: 28px;
        }
        .detail .blurb p {
            font-family: 'Times New Roman', Times, serif;
            font-size: 0.7rem;
            line-height: 1.8;
            color: var(--text-mid);
            letter-spacing: 0.3px;
            text-indent: 2em;
            text-transform: none;
        }
        .detail .blurb p:first-child { text-indent: 0; }

        .detail .back {
            margin-top: 2rem;
            background: transparent;
            border: 0.5px solid rgba(255, 255, 255, 0.2);
            color: var(--text-high);
            padding: 8px 20px;
            font-family: 'Times New Roman', serif;
            font-size: 0.65rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 28px;
            transition: background 0.3s, border-color 0.3s;
        }
        .detail .back:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .fade-in {
            opacity: 1;
            transform: translateY(0);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        @media (max-width: 1280px) {
            .slot model-viewer { width: 340px; height: 440px; }
            .shelf.selecting .slot.selected model-viewer { width: 460px; height: 580px; }
        }
        @media (max-width: 900px) {
            .shelf { flex-direction: column; align-items: center; gap: 16px; }
            .slot model-viewer { width: 300px; height: 400px; }
            .shelf.selecting .slot.selected model-viewer { width: 340px; height: 440px; }
            .shelf.selecting .slot:not(.selected) {
                max-width: 0;
                max-height: 0;
                margin: 0;
            }
        }
        @media (max-width: 480px) {
            .slot model-viewer { width: 260px; height: 340px; }
        }
    </style>
</head>
<body>

<!-- Glass distortion filter -->
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute; overflow:hidden">
    <defs>
        <filter id="glass-distortion" x="0%" y="0%" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency="0.008 0.008" numOctaves="2" seed="92" result="noise" />
            <feGaussianBlur in="noise" stdDeviation="2" result="blurred" />
            <feDisplacementMap in="SourceGraphic" in2="blurred" scale="77" xChannelSelector="R" yChannelSelector="G" />
        </filter>
    </defs>
</svg>

<nav class="nav"><a href="/">&larr; Alec Wisdom</a></nav>

<main>
<section class="hero">
    <div class="section-label fade-in">The Noetic Trilogy</div>
    <p class="select-hint fade-in">Releasing Free &#8212; 2026</p>

    <div class="shelf fade-in" id="shelf">
        <div class="slot" data-id="monism">
            <model-viewer
                src="monos-pros-monon/trilogy-monism.glb?v=1"
                alt="On Monism"
                camera-orbit="-38deg 82deg 0.72m"
                camera-target="0m 0m 0m"
                field-of-view="22deg"
                min-field-of-view="22deg"
                max-field-of-view="22deg"
                interaction-prompt="none"
                shadow-intensity="0"
                exposure="1.3"
                environment-image="neutral"
                disable-zoom
                touch-action="pan-y"
            ></model-viewer>
            <div class="label">
                <p class="title">On Monism</p>
                <p class="sub">Book I</p>
                <p class="pages">360 Pages</p>
            </div>
        </div>

        <div class="slot" data-id="gnosis">
            <model-viewer
                src="monos-pros-monon/trilogy-gnosis.glb?v=1"
                alt="On Gnosis"
                camera-orbit="-38deg 82deg 0.72m"
                camera-target="0m 0m 0m"
                field-of-view="22deg"
                min-field-of-view="22deg"
                max-field-of-view="22deg"
                interaction-prompt="none"
                shadow-intensity="0"
                exposure="1.3"
                environment-image="neutral"
                disable-zoom
                touch-action="pan-y"
            ></model-viewer>
            <div class="label">
                <p class="title">On Gnosis</p>
                <p class="sub">Book II</p>
                <p class="pages">180 Pages</p>
            </div>
        </div>

        <div class="slot" data-id="logos">
            <model-viewer
                src="monos-pros-monon/trilogy-logos.glb?v=1"
                alt="On Logos"
                camera-orbit="-38deg 82deg 0.72m"
                camera-target="0m 0m 0m"
                field-of-view="22deg"
                min-field-of-view="22deg"
                max-field-of-view="22deg"
                interaction-prompt="none"
                shadow-intensity="0"
                exposure="1.3"
                environment-image="neutral"
                disable-zoom
                touch-action="pan-y"
            ></model-viewer>
            <div class="label">
                <p class="title">On Logos</p>
                <p class="sub">Book III</p>
                <p class="pages">90 Pages</p>
            </div>
        </div>
    </div>

    <section class="detail" id="detail">
        <p class="title" id="detail-title"></p>
        <p class="sub" id="detail-sub"></p>
        <p class="pages" id="detail-pages"></p>
        <div class="blurb"><p id="detail-blurb"></p></div>
        <button class="back" id="back-btn">&larr; Back</button>
    </section>
</section>
</main>

<script>
    const BOOKS = {
        monism: {
            title: "On Monism",
            sub: "Book I",
            pages: "360 Pages",
            blurb: "On Monism traces Plato's reorientation as the fracture of an older, unified mode of knowing, and follows the consequences of that division through the history of Western thought. In the age of artificial intelligence, it marks the possibility of a return to monism as the quiet reemergence of a deeper coherence beneath analysis."
        },
        gnosis: {
            title: "On Gnosis",
            sub: "Book II",
            pages: "180 Pages",
            blurb: "Description coming soon."
        },
        logos: {
            title: "On Logos",
            sub: "Book III",
            pages: "90 Pages",
            blurb: "Description coming soon."
        }
    };

    const shelf = document.getElementById("shelf");
    const detail = document.getElementById("detail");
    let selectedId = null;

    function selectBook(id) {
        if (selectedId) return;
        selectedId = id;
        shelf.classList.add("selecting");
        document.body.classList.add("selecting");
        document.querySelectorAll(".slot").forEach(s => {
            if (s.dataset.id === id) s.classList.add("selected");
        });

        setTimeout(() => {
            const b = BOOKS[id];
            document.getElementById("detail-title").textContent = b.title;
            document.getElementById("detail-sub").textContent = b.sub;
            document.getElementById("detail-pages").textContent = b.pages;
            document.getElementById("detail-blurb").textContent = b.blurb;
            detail.classList.add("visible");
        }, 350);
    }

    function reset() {
        if (!selectedId) return;
        detail.classList.remove("visible");
        shelf.classList.remove("selecting");
        document.body.classList.remove("selecting");
        document.querySelectorAll(".slot").forEach(s => s.classList.remove("selected"));
        selectedId = null;
    }

    document.querySelectorAll(".slot").forEach(slot => {
        slot.addEventListener("click", () => {
            if (slot.classList.contains("selected")) return;
            selectBook(slot.dataset.id);
        });
    });

    document.getElementById("back-btn").addEventListener("click", reset);
    document.addEventListener("keydown", e => {
        if (e.key === "Escape" && selectedId) reset();
    });
</script>
</body>
</html>
